name: Undeploy app config files
description: Undeploy all the deployed app config files of a given repo/branch

inputs:
  app_config_root:
    description: Root directory to hold app configs
    required: true
  app_config_link_root:
    description: Root directory to hold app config links
    required: true
  repo_slug:
    description: URL-safe slug of the source repository
    required: true
  branch_slug:
    description: URL-safe slug of the source branch
    required: true

runs:
  using: composite
  steps:
    - name: Resolve app config directory
      id: resolve
      shell: bash
      env:
        APP_CONFIG_ROOT: ${{ inputs.app_config_root }}
        REPO_SLUG: ${{ inputs.repo_slug }}
        BRANCH_SLUG: ${{ inputs.branch_slug }}
        APP_CONFIG_LIB: ${{ github.action_path }}/../../bash-lib/app-config.sh
      run: |
        source "${APP_CONFIG_LIB}"

        branch_dir=$(get_app_config_branch_dir "${APP_CONFIG_ROOT}" "${REPO_SLUG}" "${BRANCH_SLUG}")

        echo "branch_dir=${branch_dir}" >> "$GITHUB_OUTPUT"

    # Remove the links first, so none is left dangling once the app configs are gone
    - name: Remove links
      shell: bash
      env:
        BRANCH_DIR: ${{ steps.resolve.outputs.branch_dir }}
        APP_CONFIG_LINK_ROOT: ${{ inputs.app_config_link_root }}
        PATH_LIB: ${{ github.action_path }}/../../../../util/bash-libs/path.sh
      run: |
        shopt -s nullglob
        source "${PATH_LIB}"

        link_root="$(validate_abs_path APP_CONFIG_LINK_ROOT)"

        # Links are created with the absolute app config path as their target (see ../deploy-app-config),
        # so the raw target tells whether a link points into this repo/branch, even if it's dangling.
        for link in "${link_root}"/*; do
          [ -L "${link}" ] || continue

          target="$(readlink "${link}")"
          if [[ "${target}" == "${BRANCH_DIR}/"* ]]; then
            echo "Removing link ${link} -> ${target}"
            rm -f "${link}"
          fi
        done

    - name: Remove app config files
      shell: bash
      env:
        BRANCH_DIR: ${{ steps.resolve.outputs.branch_dir }}
      run: |
        if [ -e "${BRANCH_DIR}" ]; then
          echo "Removing ${BRANCH_DIR}"
          rm -rf -- "${BRANCH_DIR}"
        else
          echo "Nothing deployed at ${BRANCH_DIR}"
        fi

        # Drop the repo directory too, once its last branch is gone
        rmdir --ignore-fail-on-non-empty -- "$(dirname "${BRANCH_DIR}")" 2>/dev/null || true
