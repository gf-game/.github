name: Resolve web client deployment metadata
description: |
  Resolve all the necessary metadata used for deploying the web client.

inputs:
  image_tag:
    description: Tag of the web client image to deploy
    required: true
  env_name:
    description: Environment being deployed into
    required: true
  web_deploy_file_root:
    description: Root directory on the deploy host where each env/branch pair's deployment state lives
    required: true
  bundle_root:
    description: Root directory on the host where bundles are stored
    required: true
  bundle_link_root:
    description: Root directory on the host where bundle links are stored
    required: true
  app_config_root:
    description: Root directory on the host where app config files are stored
    required: true
  app_config_link_root:
    description: Root directory on the host where app config links are stored
    required: true
  nginx_conf_root:
    description: Directory on the deploy host holding nginx server block configs
    required: true
  portal_url:
    description: URL of the portal to add to the app config
    required: true
  game_server_url:
    description: URL template of the game server to add to the app config
    required: true
  bundle_cdn_url:
    description: URL template of the bundle CDN to add to the app config
    required: true
  server_domain_suffix:
    description: Domain suffix appended to the branch/env/repo subdomain
    required: true
  app_config:
    description: App config
    required: true
  nginx_server_config_template:
    description: Template of nginx reverse server config
    required: true

outputs:
  branch_name:
    description: Source branch the web client image was built from
    value: ${{ steps.src_branch.outputs.value }}
  branch_slug:
    description: URL-safe slug of the source branch
    value: ${{ steps.vars.outputs.branch_slug }}
  repo_slug:
    description: URL-safe slug of the repository name
    value: ${{ steps.vars.outputs.repo_slug }}
  project_name:
    description: Docker Compose project name for this env/branch deployment
    value: ${{ steps.vars.outputs.project_name }}
  app_version:
    description: Version of the app the web client image was built for (from the image's app.version label)
    value: ${{ steps.vars.outputs.app_version }}
  app_sn:
    description: App SN of the image
    value: ${{ steps.vars.outputs.app_sn }}
  platform:
    description: Cocos Creator build platform of the web client image (from the image's build.platform label)
    value: ${{ steps.vars.outputs.platform }}
  cocos_version:
    description: Version of Cocos Creator the web client image was built with (from the image's build.cocos_version label)
    value: ${{ steps.vars.outputs.cocos_version }}
  bundle_registry_sn:
    description: Bundle registry SN for the app in the given environment
    value: ${{ steps.vars.outputs.bundle_registry_sn }}
  deploy_file_dir:
    description: Directory on the deploy host holding this env/branch pair's deployment state
    value: ${{ steps.vars.outputs.deploy_file_dir }}
  app_config:
    description: App config
    value: ${{ steps.vars.outputs.app_config }}
  bundle_root:
    description: Root directory on the host where bundles are stored
    value: ${{ steps.vars.outputs.bundle_root }}
  bundle_link_root:
    description: Root directory on the host where bundle links are stored
    value: ${{ steps.vars.outputs.bundle_link_root }}
  app_config_root:
    description: Root directory on the host where app config files are stored
    value: ${{ steps.vars.outputs.app_config_root }}
  app_config_link_root:
    description: Root directory on the host where app config links are stored
    value: ${{ steps.vars.outputs.app_config_link_root }}
  portal_url:
    description: URL of the portal to add to the app config
    value: ${{ steps.vars.outputs.portal_url }}
  game_server_url:
    description: URL template of the game server to add to the app config
    value: ${{ steps.vars.outputs.game_server_url }}
  bundle_cdn_url:
    description: URL template of the bundle CDN to add to the app config
    value: ${{ steps.vars.outputs.bundle_cdn_url }}
  nginx_server_config_template:
    description: Template of nginx reverse server config
    value: ${{ steps.vars.outputs.nginx_server_config_template }}
  server_domain_suffix:
    description: Domain suffix appended to the branch/env/repo subdomain
    value: ${{ steps.vars.outputs.server_domain_suffix }}
  nginx_conf_root:
    description: Directory on the deploy host holding nginx server block configs
    value: ${{ steps.vars.outputs.nginx_conf_root }}
  env_slug:
    description: Env slug
    value: ${{ steps.vars.outputs.env_slug }}

runs:
  using: composite
  steps:
    - name: Fetch source repo from image label
      id: src_repo
      uses: gf-game/.github/.github/actions/docker/fetch-image-label-value@754023ba96851427375d6bfff07ebd6394e772b1
      with:
        image_tag: ${{ inputs.image_tag }}
        label: org.opencontainers.image.source

    - name: Fetch source branch from image label
      id: src_branch
      uses: gf-game/.github/.github/actions/docker/fetch-image-label-value@754023ba96851427375d6bfff07ebd6394e772b1
      with:
        image_tag: ${{ inputs.image_tag }}
        label: org.opencontainers.image.ref.name

    - name: Fetch app version from image label
      id: app_version
      uses: gf-game/.github/.github/actions/docker/fetch-image-label-value@754023ba96851427375d6bfff07ebd6394e772b1
      with:
        image_tag: ${{ inputs.image_tag }}
        label: app.version

    - name: Fetch app SN from image label
      id: app_sn
      uses: gf-game/.github/.github/actions/docker/fetch-image-label-value@754023ba96851427375d6bfff07ebd6394e772b1
      with:
        image_tag: ${{ inputs.image_tag }}
        label: app.sn

    - name: Fetch build platform from image label
      id: platform
      uses: gf-game/.github/.github/actions/docker/fetch-image-label-value@754023ba96851427375d6bfff07ebd6394e772b1
      with:
        image_tag: ${{ inputs.image_tag }}
        label: build.platform

    - name: Fetch cocos creator version from image label
      id: cocos_version
      uses: gf-game/.github/.github/actions/docker/fetch-image-label-value@754023ba96851427375d6bfff07ebd6394e772b1
      with:
        image_tag: ${{ inputs.image_tag }}
        label: build.cocos_version

    - name: Resolve deployment names, paths, and config
      id: vars
      shell: bash
      env:
        SRC_REPO: ${{ steps.src_repo.outputs.value }}
        SRC_BRANCH: ${{ steps.src_branch.outputs.value }}
        ENV_NAME: ${{ inputs.env_name }}
        APP_VERSION: ${{ steps.app_version.outputs.value }}
        APP_SN: ${{ steps.app_sn.outputs.value }}
        PLATFORM: ${{ steps.platform.outputs.value }}
        COCOS_VERSION: ${{ steps.cocos_version.outputs.value }}
        DEPLOY_FILE_ROOT: ${{ inputs.web_deploy_file_root }}
        BUNDLE_ROOT: ${{ inputs.bundle_root }}
        BUNDLE_LINK_ROOT: ${{ inputs.bundle_link_root }}
        APP_CONFIG_ROOT: ${{ inputs.app_config_root }}
        APP_CONFIG_LINK_ROOT: ${{ inputs.app_config_link_root }}
        PORTAL_URL: ${{ inputs.portal_url }}
        GAME_SERVER_URL: ${{ inputs.game_server_url }}
        BUNDLE_CDN_URL: ${{ inputs.bundle_cdn_url }}
        SERVER_DOMAIN_SUFFIX: ${{ inputs.server_domain_suffix }}
        NGINX_CONF_ROOT: ${{ inputs.nginx_conf_root }}
        APP_CONFIG: ${{ inputs.app_config }}
        NGINX_SERVER_CONFIG_TEMPLATE: ${{ inputs.nginx_server_config_template }}
        PATH_LIB: ${{ github.action_path }}/../../../../util/bash-libs/path.sh
        STRING_LIB: ${{ github.action_path }}/../../../../util/bash-libs/string.sh
        SEMVER_LIB: ${{ github.action_path }}/../../../../util/bash-libs/semver.sh
        PLATFORM_LIB: ${{ github.action_path }}/../../bash-lib/platform.sh
        DOCKER_COMPOSE_LIB: ${{ github.action_path }}/../../bash-lib/docker-compose.sh
      run: |
        source "$PATH_LIB"
        source "$STRING_LIB"
        source "$SEMVER_LIB"
        source "$PLATFORM_LIB"
        source "$DOCKER_COMPOSE_LIB"

        # Slugify the repo name
        SRC_REPO="${SRC_REPO##*/}"
        repo_slug=$(slugify SRC_REPO)
        echo "repo_slug=${repo_slug}" >> "$GITHUB_OUTPUT"

        # Slugify the branch name
        branch_slug=$(slugify SRC_BRANCH)
        echo "branch_slug=${branch_slug}" >> "$GITHUB_OUTPUT"

        # Compute the SN of the bundle registry
        APP_SN=$(trim_non_empty APP_SN)
        ENV_NAME=$(trim_non_empty ENV_NAME)
        bundle_registry_sn="$(printf '%s' "${APP_SN}|${ENV_NAME}" | sha256sum | cut -d ' ' -f1)"
        echo "app_sn=${APP_SN}" >> "$GITHUB_OUTPUT"
        echo "bundle_registry_sn=${bundle_registry_sn}" >> "$GITHUB_OUTPUT"

        # Validate and output app version
        APP_VERSION=$(trim_non_empty APP_VERSION)
        validate_semver APP_VERSION
        echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"

        # Validate and output platform
        PLATFORM=$(trim_non_empty PLATFORM)
        validate_platform PLATFORM
        echo "platform=${PLATFORM}" >> "$GITHUB_OUTPUT"

        # Validate and output cocos version
        COCOS_VERSION=$(trim_non_empty COCOS_VERSION)
        validate_semver COCOS_VERSION
        echo "cocos_version=${COCOS_VERSION}" >> "$GITHUB_OUTPUT"

        # Compute name of the docker compose project
        env_slug=$(slugify ENV_NAME)
        echo "env_slug=${env_slug}" >> "$GITHUB_OUTPUT"
        project_name=$(get_project_name "${repo_slug}" "${env_slug}" "${branch_slug}")
        echo "project_name=${project_name}" >> "$GITHUB_OUTPUT"

        # Compute path of the directory for the deployment files
        DEPLOY_FILE_ROOT=$(validate_abs_path DEPLOY_FILE_ROOT)
        deploy_file_dir="${DEPLOY_FILE_ROOT}/${env_slug}/${branch_slug}"
        deploy_file_dir=$(validate_abs_path deploy_file_dir)
        echo "deploy_file_dir=${deploy_file_dir}" >> "$GITHUB_OUTPUT"

        # Validate path of the root directory for the bundles
        BUNDLE_ROOT=$(validate_abs_path BUNDLE_ROOT)
        echo "bundle_root=${BUNDLE_ROOT}" >> "$GITHUB_OUTPUT"

        # Validate path of the root directory for the bundle links
        BUNDLE_LINK_ROOT=$(validate_abs_path BUNDLE_LINK_ROOT)
        echo "bundle_link_root=${BUNDLE_LINK_ROOT}" >> "$GITHUB_OUTPUT"

        # Validate path of the root directory for the app configurations
        APP_CONFIG_ROOT=$(validate_abs_path APP_CONFIG_ROOT)
        echo "app_config_root=${APP_CONFIG_ROOT}" >> "$GITHUB_OUTPUT"

        # Validate path of the root directory for the app configuration links
        APP_CONFIG_LINK_ROOT=$(validate_abs_path APP_CONFIG_LINK_ROOT)
        echo "app_config_link_root=${APP_CONFIG_LINK_ROOT}" >> "$GITHUB_OUTPUT"

        # Validate path of the root directory for the nginx configurations
        NGINX_CONF_ROOT=$(validate_abs_path NGINX_CONF_ROOT)
        echo "nginx_conf_root=${NGINX_CONF_ROOT}" >> "$GITHUB_OUTPUT"

        # Trim and validate the urls aren't empty
        # Since those urls may contains placeholders in the form of '<placeholder-name>'
        # and the character '<' and '>' is not valid http(s) url characters, postpone the
        # http-url validation after the placeholders are substituted with the real value.
        PORTAL_URL=$(trim_non_empty PORTAL_URL)
        GAME_SERVER_URL=$(trim_non_empty GAME_SERVER_URL)
        BUNDLE_CDN_URL=$(trim_non_empty BUNDLE_CDN_URL)
        echo "portal_url=${PORTAL_URL}" >> "$GITHUB_OUTPUT"
        echo "game_server_url=${GAME_SERVER_URL}" >> "$GITHUB_OUTPUT"
        echo "bundle_cdn_url=${BUNDLE_CDN_URL}" >> "$GITHUB_OUTPUT"

        # Validate suffix of the self-hosted server domain
        SERVER_DOMAIN_SUFFIX=$(trim_non_empty SERVER_DOMAIN_SUFFIX)
        echo "server_domain_suffix=$SERVER_DOMAIN_SUFFIX" >> "$GITHUB_OUTPUT"

        {
          echo "app_config<<EOF"
          echo "$APP_CONFIG"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

        {
          echo "nginx_server_config_template<<EOF"
          echo "$NGINX_SERVER_CONFIG_TEMPLATE"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
