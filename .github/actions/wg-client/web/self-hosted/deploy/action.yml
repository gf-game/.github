name: Deploy web client on self-hosted server
description: Deploy web client on self-hosted server

inputs:
  project_name:
    description: Docker Compose project name for this env/branch deployment
    required: true
  compose_file:
    description: Path to the docker-compose.yml file to deploy
    required: true
  dot_env_file:
    description: Path to the .env used by docker compose
    required: true
  deploy_file_dir:
    description: Directory on the deploy host holding this env/branch pair's deployment state
    required: true
  env_name:
    description: Environment being deployed into
    required: true
  env_slug:
    description: Slug of the environment being deployed into
    required: true
  repo_slug:
    description: URL-safe slug of the source repository
    required: true
  branch_slug:
    description: URL-safe slug of the source branch
    required: true
  cocos_version:
    description: Version of Cocos Creator the web client image was built with
    required: true
  platform:
    description: Cocos Creator build platform of the web client image
    required: true
  app_version:
    description: Version of the app the web client image was built for
    required: true
  bundle_root:
    description: Root directory on host where bundles should go to
    required: true
  bundle_link_root:
    description: Root directory on host where bundle links should go to
    required: true
  bundle_registry_sn:
    description: Bundle registry sn
    required: true
  bundle_artifact_name:
    description: The name of bundle artifact file
    required: true
  app_sn:
    description: app sn
    required: true
  app_config:
    description: The content of app config
    required: true
  app_config_link_root:
    description: Root directory to hold app config links
    required: true
  app_config_root:
    description: Root directory to hold app config files
    required: true
  portal_url:
    description: URL of the portal to add to the app config
    required: true
  game_server_url:
    description: URL template of the game server to add to the app config
    required: true
  bundle_cdn_url:
    description: URL template of the bundle CDN to add to the app config
    required: true
  nginx_server_config_template:
    description: printf template for the nginx server block config
    required: true
  server_domain_suffix:
    description: Domain suffix appended to the branch/env/repo subdomain
    required: true
  nginx_conf_root:
    description: Directory on the deploy host holding nginx server block configs
    required: true

runs:
  using: composite
  steps:
    - name: Deploy with Docker Compose
      shell: bash
      env:
        PROJECT_NAME: ${{ inputs.project_name }}
        COMPOSE_FILE: ${{ inputs.compose_file }}
        DOT_ENV_FILE: ${{ inputs.dot_env_file }}
      run: |
        docker compose \
          --project-name "${PROJECT_NAME}" \
          --env-file "${DOT_ENV_FILE}" \
          -f "${COMPOSE_FILE}" \
          pull

        docker compose \
          --project-name "${PROJECT_NAME}" \
          --env-file "${DOT_ENV_FILE}" \
          -f "${COMPOSE_FILE}" \
          up -d --remove-orphans

    - name: Record assigned host port
      id: ports
      shell: bash
      env:
        DEPLOY_FILE_DIR: ${{ inputs.deploy_file_dir }}
        PROJECT_NAME: ${{ inputs.project_name }}
        COMPOSE_FILE: ${{ inputs.compose_file }}
        DOT_ENV_FILE: ${{ inputs.dot_env_file }}
        BRANCH_SLUG: ${{ inputs.branch_slug }}
        ENV_NAME: ${{ inputs.env_name }}
      run: |
        web_port="$(docker compose \
          --project-name "${PROJECT_NAME}" \
          --env-file "${DOT_ENV_FILE}" \
          -f "${COMPOSE_FILE}" \
          port client 80 | cut -d: -f2)"

        echo "${web_port}" > "${DEPLOY_FILE_DIR}/web_port"
        echo "web=${web_port}" >> "$GITHUB_OUTPUT"
        echo "Branch \`${BRANCH_SLUG}\` (\`${ENV_NAME}\`) is reachable on host port \`${web_port}\`" >> "$GITHUB_STEP_SUMMARY"

    - name: Deploy bundles
      if: inputs.bundle_artifact_name != ''
      uses: gf-game/.github/.github/actions/wg-client/web/self-hosted/deploy-bundle@a305e406277c2a68a2b1aeb65cd923a8bfdb33f8
      with:
        bundle_registry_sn: ${{ inputs.bundle_registry_sn }}
        bundle_root: ${{ inputs.bundle_root }}
        bundle_link_root: ${{ inputs.bundle_link_root }}
        bundle_artifact_name: ${{ inputs.bundle_artifact_name }}
        repo_slug: ${{ inputs.repo_slug }}
        branch_slug: ${{ inputs.branch_slug }}
        cocos_version: ${{ inputs.cocos_version }}
        platform: ${{ inputs.platform }}
        app_version: ${{ inputs.app_version }}
        env_slug: ${{ inputs.env_slug }}

    - name: Deploy app config
      uses: gf-game/.github/.github/actions/wg-client/web/self-hosted/deploy-app-config@75de4ea9b45cf370a741e4bda1112e67fc4cff5e
      with:
        app_config: ${{ inputs.app_config }}
        app_config_link_root: ${{ inputs.app_config_link_root }}
        app_config_root: ${{ inputs.app_config_root }}
        app_sn: ${{ inputs.app_sn }}
        portal_url: ${{ inputs.portal_url }}
        game_server_url: ${{ inputs.game_server_url }}
        bundle_cdn_url: ${{ inputs.bundle_cdn_url }}
        bundle_artifact_name: ${{ inputs.bundle_artifact_name }}
        bundle_registry_sn: ${{ inputs.bundle_registry_sn }}
        repo_slug: ${{ inputs.repo_slug }}
        branch_slug: ${{ inputs.branch_slug }}
        env_slug: ${{ inputs.env_slug }}
        cocos_version: ${{ inputs.cocos_version }}
        platform: ${{ inputs.platform }}
        app_version: ${{ inputs.app_version }}

    - name: Deploy reverse proxy
      uses: gf-game/.github/.github/actions/wg-client/web/self-hosted/deploy-reverse-proxy@a46019f574b610e184b78c0d4ab7013e9ba8cd53
      with:
        nginx_server_config_template: ${{ inputs.nginx_server_config_template }}
        server_domain_suffix: ${{ inputs.server_domain_suffix }}
        nginx_conf_root: ${{ inputs.nginx_conf_root }}
        repo_slug: ${{ inputs.repo_slug }}
        branch_slug: ${{ inputs.branch_slug }}
        env_slug: ${{ inputs.env_slug }}
        env_name: ${{ inputs.env_name }}
        web_port: ${{ steps.ports.outputs.web }}
