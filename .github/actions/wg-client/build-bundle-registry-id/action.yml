name: Build Bundle Registry ID
description: Compute a deterministic bundle registry ID by hashing the concatenation of the repo id, branch name, engine version, build platform, app version, and deploy environment

inputs:
  repo_id:
    description: GitHub repo id
    required: true
  branch_name:
    description: git branch name
    required: true
  engine_version:
    description: game engine version
    required: true
  build_platform:
    description: target platform
    required: true
  app_version:
    description: app version
    required: true
  deploy_env:
    description: deployment environment
    required: true

outputs:
  bundle_registry_id:
    description: SHA-256 hash of the concatenated inputs
    value: ${{ steps.hash.outputs.bundle_registry_id }}

runs:
  using: composite
  steps:
    - name: Compute bundle registry ID hash
      id: hash
      shell: bash
      env:
        REPO_ID: ${{ inputs.repo_id }}
        BRANCH_NAME: ${{ inputs.branch_name }}
        ENGINE_VERSION: ${{ inputs.engine_version }}
        BUILD_PLATFORM: ${{ inputs.build_platform }}
        APP_VERSION: ${{ inputs.app_version }}
        DEPLOY_ENV: ${{ inputs.deploy_env }}
      run: |
        bundle_registry_id="$(printf '%s' "${REPO_ID}${BRANCH_NAME}${ENGINE_VERSION}${BUILD_PLATFORM}${APP_VERSION}${DEPLOY_ENV}" | sha256sum | cut -d ' ' -f1)"
        echo "bundle_registry_id=${bundle_registry_id}" >> "$GITHUB_OUTPUT"
