name: Build server

on:
  workflow_call:
    inputs:
      dockerfile:
        description: Path to the Dockerfile to build, relative to the repo root
        type: string
        required: true
      targets:
        description: >-
          JSON array of {"target","image_name"} pairs, one per Dockerfile
          build stage to build and push
        type: string
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  # Scoped per Dockerfile (not just workflow+ref) so that a caller invoking
  # this reusable workflow multiple times for different Dockerfiles/images
  # doesn't serialize unrelated builds against each other.
  group: build-server-${{ github.workflow }}-${{ github.ref }}-${{ inputs.dockerfile }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    name: Validate targets input
    runs-on: [self-hosted, Linux, docker]
    steps:
      - name: Ensure image_name values are unique
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          duplicates="$(jq -r '[.[].image_name] | group_by(.) | map(select(length > 1)[0]) | .[]' <<<"$TARGETS")"
          if [ -n "$duplicates" ]; then
            echo "::error::Duplicate image_name value(s) in 'targets' input: $duplicates"
            exit 1
          fi

  build-image:
    name: Build and push ${{ matrix.target }} image
    needs: validate
    runs-on: [self-hosted, Linux, docker]
    timeout-minutes: 15
    strategy:
      matrix:
        include: ${{ fromJSON(inputs.targets) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Compute image name and tag
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image_name }}
          tags: type=raw,value={{sha}}
          labels: |
            org.opencontainers.image.ref.name=${{ github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          keep-state: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.target }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-latest:
    name: Promote ${{ matrix.image_name }} to latest
    needs: build-image
    if: github.ref_type == 'branch'
    runs-on: [self-hosted, Linux, docker]
    timeout-minutes: 5
    strategy:
      matrix:
        image_name: ${{ fromJSON(inputs.targets).*.image_name }}
    steps:
      - name: Compute source tag (per-commit)
        id: source
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image_name }}
          tags: type=raw,value={{sha}}

      - name: Compute destination tag (latest)
        id: dest
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image_name }}
          tags: type=raw,value={{branch}}-latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point latest tag at the commit-tagged image
        run: docker buildx imagetools create --tag ${{ steps.dest.outputs.tags }} ${{ steps.source.outputs.tags }}
