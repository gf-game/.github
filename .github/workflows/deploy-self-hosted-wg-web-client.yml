name: Deploy web client on self-hosted machine

on:
  workflow_call:
    inputs:
      host_label:
        description: Label of the host where this workflow deploys the web client
        type: string
        required: true
      image_tag:
        description: Tag of the docker image containing web client
        type: string
        required: true
      deploy_env:
        description: Environment this workflow is gonna deploy into
        type: string
        required: true
      bundle_artifact_name:
        description: Name of workflow artifact containing web client's remote bundles
        type: string
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-self-hosted-wg-web-client-${{ inputs.image_tag }}-${{ inputs.deploy_env }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    runs-on: [self-hosted, "${{inputs.host_label}}", Linux, docker]
    environment:
      name: ${{ inputs.deploy_env }}
      deployment: true
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve metadata
        id: metadata
        uses: gf-game/.github/.github/actions/wg-client/web/self-hosted/resolve-metadata@35fbb9e71f38b79bda281d544152a31338275ac2
        with:
          image_tag: ${{ inputs.image_tag }}
          env_name: ${{ inputs.deploy_env }}

      - name: Prepare deployment files
        id: files
        uses: gf-game/.github/.github/actions/wg-client/web/self-hosted/prepare-files@6463ed9c50354f64c5ea3466fbb417ed894a164d
        with:
          image_tag: ${{ inputs.image_tag }}
          deploy_file_dir: ${{ steps.metadata.outputs.deploy_file_dir }}

      - name: Deploy
        uses: gf-game/.github/.github/actions/wg-client/web/self-hosted/deploy@769153c191c1bae1fe159f58566faa4a5416c399
        with:
          project_name: ${{ steps.metadata.outputs.project_name }}
          compose_file: ${{ steps.files.outputs.compose_file }}
          dot_env_file: ${{ steps.files.outputs.env_file }}
          deploy_file_dir: ${{ steps.metadata.outputs.deploy_file_dir }}
          env_name: ${{ inputs.deploy_env }}
          env_slug: ${{ steps.metadata.outputs.env_slug }}
          repo_slug: ${{ steps.metadata.outputs.repo_slug }}
          branch_slug: ${{ steps.metadata.outputs.branch_slug }}
          bundle_file_dir: ${{ steps.metadata.outputs.bundle_file_dir }}
          bundle_registry_sn: ${{ steps.metadata.outputs.bundle_registry_sn }}
          bundle_artifact_name: ${{ inputs.bundle_artifact_name }}
          app_sn: ${{ steps.metadata.outputs.app_sn }}
          app_config: ${{ steps.metadata.outputs.app_config }}
          app_config_root: ${{ steps.metadata.outputs.app_config_root }}
          portal_url: ${{ steps.metadata.outputs.portal_url }}
          game_server_url: ${{ steps.metadata.outputs.game_server_url }}
          bundle_cdn_url: ${{ steps.metadata.outputs.bundle_cdn_url }}
          nginx_server_config_template: ${{ steps.metadata.outputs.nginx_server_config_template }}
          server_domain_suffix: ${{ steps.metadata.outputs.server_domain_suffix }}
          nginx_conf_root: ${{ steps.metadata.outputs.nginx_conf_root }}
